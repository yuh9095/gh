name: Build Google Clang r487747c for Linux ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-clang-arm64.yml"

permissions:
  contents: read

concurrency:
  group: clang-r487747c-arm64
  cancel-in-progress: false

jobs:
  build:
    name: Cross-build AArch64 Linux Clang
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      LLVM_PROJECT_REV: d9f89f4d16663d5012e5c09495f3b30ece3d2362
      LLVM_ANDROID_REV: 8443a75fcd5c80245b194f6510b98a11098fe7fe
      LLVM_SVN_REV: "487747"
      TOOLCHAIN_UTILS_REV: 61074474aaa4ed8c663fec2e98764653db00300d
      PREBUILT_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl ca-certificates \
            python3 python3-pip xz-utils file binutils \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu qemu-user
          df -h /

      - name: Fetch pinned Google LLVM sources
        shell: bash
        run: |
          set -euxo pipefail

          git clone https://android.googlesource.com/toolchain/llvm-project llvm-project
          git -C llvm-project fetch --depth=1 origin "$LLVM_PROJECT_REV"
          git -C llvm-project checkout --detach "$LLVM_PROJECT_REV"

          git clone https://android.googlesource.com/toolchain/llvm_android llvm_android
          git -C llvm_android fetch --depth=1 origin "$LLVM_ANDROID_REV"
          git -C llvm_android checkout --detach "$LLVM_ANDROID_REV"

          test "$(git -C llvm-project rev-parse HEAD)" = "$LLVM_PROJECT_REV"
          test "$(git -C llvm_android rev-parse HEAD)" = "$LLVM_ANDROID_REV"

          echo "LLVM project: $(git -C llvm-project rev-parse HEAD)"
          echo "LLVM Android: $(git -C llvm_android rev-parse HEAD)"
          grep -nE "_svn_revision|svn_revision" llvm_android/android_version.py || true

      - name: Download Google bootstrap Clang
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/google-clang"
          curl -fL --retry 3 "$PREBUILT_URL" -o "$RUNNER_TEMP/clang-r487747c.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang-r487747c.tar.gz" -C "$RUNNER_TEMP/google-clang"

          BOOTSTRAP_CLANG="$(find "$RUNNER_TEMP/google-clang" -type f -name clang -perm -111 -print -quit)"
          test -n "$BOOTSTRAP_CLANG"
          BOOTSTRAP_BIN="$(dirname "$BOOTSTRAP_CLANG")"
          test -x "$BOOTSTRAP_BIN/clang++"
          test -x "$BOOTSTRAP_BIN/ld.lld"
          echo "BOOTSTRAP_BIN=$BOOTSTRAP_BIN" >> "$GITHUB_ENV"
          "$BOOTSTRAP_BIN/clang" --version

      - name: Apply Google patches from PATCHES.json
        shell: bash
        run: |
          set -euxo pipefail

          # PATCHES.json is the source of truth. Do not apply every *.patch
          # file with a shell glob: patch_manager filters by SVN version and
          # applies the metadata-defined patch set in the intended order.
          git clone https://android.googlesource.com/platform/external/toolchain-utils toolchain-utils
          git -C toolchain-utils fetch --depth=1 origin "$TOOLCHAIN_UTILS_REV"
          git -C toolchain-utils checkout --detach "$TOOLCHAIN_UTILS_REV"
          export PYTHONPATH="$PWD/toolchain-utils:${PYTHONPATH:-}"

          python3 toolchain-utils/llvm_tools/patch_manager.py \
            --svn_version "$LLVM_SVN_REV" \
            --patch_metadata_file "$PWD/llvm_android/patches/PATCHES.json" \
            --src_path "$PWD/llvm-project" \
            --failure_mode fail

          git -C llvm-project status --short
          if ! git -C llvm-project diff --check; then
            echo "::warning::Google's pinned patch set contains whitespace errors; keeping upstream patch content unchanged."
          fi
          git -C llvm-project diff --stat

      - name: Build native x86_64 TableGen tools
        shell: bash
        run: |
          set -euxo pipefail

          # TableGen programs execute on the build machine. Build them natively
          # with the runner's x86_64 compiler; do not look for them in the
          # Google bootstrap archive or try to execute AArch64 binaries here.
          cmake -G Ninja \
            -S llvm-project/llvm \
            -B build-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DLLVM_ENABLE_PROJECTS="clang" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF

          cmake --build build-native --target llvm-tblgen clang-tblgen --parallel 2

          test -x build-native/bin/llvm-tblgen
          test -x build-native/bin/clang-tblgen
          file build-native/bin/llvm-tblgen build-native/bin/clang-tblgen
          readelf -h build-native/bin/llvm-tblgen | grep -E "Machine:.*X86-64"

          echo "LLVM_TABLEGEN=$PWD/build-native/bin/llvm-tblgen" >> "$GITHUB_ENV"
          echo "CLANG_TABLEGEN=$PWD/build-native/bin/clang-tblgen" >> "$GITHUB_ENV"

      - name: Configure AArch64 Linux host compiler
        shell: bash
        run: |
          set -euxo pipefail

          test -x "$LLVM_TABLEGEN"
          test -x "$CLANG_TABLEGEN"

          # Do not set CMAKE_SYSROOT here: Ubuntu's cross libc linker script
          # contains absolute /usr/aarch64-linux-gnu paths, which LLD would
          # incorrectly re-root and look up twice when a sysroot is active.
          cmake -G Ninja \
            -S llvm-project/llvm \
            -B build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_C_COMPILER="$BOOTSTRAP_BIN/clang" \
            -DCMAKE_CXX_COMPILER="$BOOTSTRAP_BIN/clang++" \
            -DCMAKE_C_COMPILER_TARGET=aarch64-linux-gnu \
            -DCMAKE_CXX_COMPILER_TARGET=aarch64-linux-gnu \
            -DCMAKE_C_COMPILER_EXTERNAL_TOOLCHAIN=/usr \
            -DCMAKE_CXX_COMPILER_EXTERNAL_TOOLCHAIN=/usr \
            -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DLLVM_HOST_TRIPLE=aarch64-linux-gnu \
            -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-linux-gnu \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_PROJECTS="clang;lld;clang-tools-extra;polly;bolt" \
            -DLLVM_ENABLE_RUNTIMES="compiler-rt;libcxx;libcxxabi" \
            -DLLVM_TABLEGEN="$LLVM_TABLEGEN" \
            -DCLANG_TABLEGEN="$CLANG_TABLEGEN" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_ENABLE_STATIC_ANALYZER=ON \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DLLVM_BUILD_RUNTIME=ON \
            -DLLVM_BUILTIN_TARGETS=aarch64-linux-gnu \
            -DLLVM_RUNTIME_TARGETS=aarch64-linux-gnu \
            -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON \
            -DCOMPILER_RT_BUILD_LIBFUZZER=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage"

      - name: Build complete ARM64 LLVM toolchain
        run: |
          set -euxo pipefail
          # Build the default "all" target: LLVM, Clang, LLD, Clang Tools Extra,
          # Polly, BOLT, and the selected ARM64 compiler runtimes.
          cmake --build build-arm64 --parallel 2
          cmake --install build-arm64

      - name: Verify ARM64 toolchain components
        shell: bash
        run: |
          set -euxo pipefail
          # Check the principal Clang, Clang Tools Extra, LLVM utilities,
          # linker, and BOLT executables are installed.
          for tool in \
            clang clang++ clang-format clang-tidy clangd clang-scan-deps \
            ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readobj \
            llvm-strip llvm-ranlib llvm-config llvm-as llvm-dis llvm-link \
            llvm-symbolizer llvm-profdata llvm-cov llvm-dwarfdump \
            llvm-size llvm-strings llvm-bolt; do
            test -x "stage/bin/$tool"
            readelf -h "stage/bin/$tool" | grep -q "Machine:.*AArch64"
          done

          file stage/bin/clang stage/bin/clang++ stage/bin/ld.lld
          qemu-aarch64 -L /usr/aarch64-linux-gnu stage/bin/clang --version
          qemu-aarch64 -L /usr/aarch64-linux-gnu stage/bin/ld.lld --version
          find stage -name 'libclang_rt.builtins-aarch64.a' -print -quit | grep .

      - name: Package toolchain and build provenance
        shell: bash
        run: |
          set -euxo pipefail
          {
            echo "llvm-project=$LLVM_PROJECT_REV"
            echo "llvm_android=$LLVM_ANDROID_REV"
            echo "llvm_svn_revision=$LLVM_SVN_REV"
            echo "prebuilt=$PREBUILT_URL"
            echo "host_target=aarch64-linux-gnu"
            echo "native_tablegen=build-native/bin/llvm-tblgen,build-native/bin/clang-tblgen"
            echo "google_patches=PATCHES.json via toolchain-utils patch_manager.py"
          } > stage/BUILD-PROVENANCE.txt

          tar -C stage -cJf clang-r487747c-linux-arm64.tar.xz .
          sha256sum clang-r487747c-linux-arm64.tar.xz > clang-r487747c-linux-arm64.tar.xz.sha256

      - name: Upload ARM64 Clang artifact
        uses: actions/upload-artifact@v4
        with:
          name: clang-r487747c-linux-arm64
          path: |
            clang-r487747c-linux-arm64.tar.xz
            clang-r487747c-linux-arm64.tar.xz.sha256
          if-no-files-found: error
          retention-days: 30
